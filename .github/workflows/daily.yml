name: daily-fin-digest

on:
  schedule:
    - cron: "0 0 * * *"   # UTC 00:00 = 北京时间 08:00
  workflow_dispatch: {}

permissions:
  contents: write   # 允许把日报提交回仓库

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 生成并推送日报
        env:
          LLM_API_KEY: ${{ secrets.ALIYUN_API_WECHAT || secrets.DEEPSEEK_SCHOOL_KEY || secrets.DEEPSEEK_API_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://dashscope.aliyuncs.com/compatible-mode/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'qwen3.7-max' }}
          LLM_MAX_TOKENS: "2200"
        run: python main.py
      - name: 存档日报到仓库
        run: |
          set -e
          git config user.name "fin-daily-bot"
          git config user.email "fin-daily-bot@users.noreply.github.com"
          git add reports/ || true
          if git diff --staged --quiet; then
            echo "今日日报已存在，无变化"
          else
            git commit -m "📰 日报存档 $(date -u -d '+8 hour' +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
