name: daily-fin-digest

on:
  schedule:
    - cron: "0 0 * * *"   # UTC 00:00 = 北京时间 08:00（GitHub 定时偶有几分钟漂移）
  workflow_dispatch: {}    # 允许在 Actions 页面手动触发

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 生成并推送日报
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_SCHOOL_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.deepseek.com' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-chat' }}
          LLM_MAX_TOKENS: "1600"
        run: python main.py
