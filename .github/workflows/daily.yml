name: daily-fin-digest

on:
  schedule:
    - cron: "0 0 * * *"   # UTC 00:00 = 北京时间 08:00
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 生成并推送日报
        env:
          LLM_API_KEY: ${{ secrets.ALIYUN_API_WECHAT || secrets.DEEPSEEK_SCHOOL_KEY || secrets.DEEPSEEK_API_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://dashscope.aliyuncs.com/compatible-mode/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'qwen3.7-max' }}
          LLM_MAX_TOKENS: "2200"
        run: python main.py
